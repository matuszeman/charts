suite: traefik-ingress-route
templates:
  - traefik-ingress-route.yaml
values:
  - values/minimum.yaml
tests:
  - it: should create IngressRoute
    values:
      - values/service.yaml
    set:
      ingressRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /
          pathType: PathPrefix
    asserts:
      - matchSnapshot: {}

  - it: should create IngressRoute with Exact pathType
    values:
      - values/service.yaml
    set:
      ingressRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /exact
          pathType: Exact
    asserts:
      - matchSnapshot: {}

  - it: should create IngressRoute with RegularExpression pathType
    values:
      - values/service.yaml
    set:
      ingressRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: "/api/v[0-9]+"
          pathType: RegularExpression
    asserts:
      - matchSnapshot: {}

  - it: when forwardAuth enabled, should add middleware and generate Middleware resource
    values:
      - values/service.yaml
    set:
      ingressRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /
          forwardAuth:
            enabled: true
            appName: oauth2proxy
    asserts:
      - matchSnapshot: {}

  - it: when forwardAuth authQueryParams set, should append query string to address
    values:
      - values/service.yaml
    set:
      ingressRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /
          forwardAuth:
            enabled: true
            appName: oauth2proxy
            authQueryParams:
              allowed_groups: admins
    asserts:
      - documentIndex: 1
        equal:
          path: spec.forwardAuth.address
          value: "http://oauth2proxy.auth.svc.cluster.local/oauth2/auth?allowed_groups=admins"

  - it: when authUrl/signinUrl use templating, should render them with tpl
    values:
      - values/service.yaml
    set:
      ingressRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /
          forwardAuth:
            enabled: true
            authUrl: 'http://auth.{{ .Release.Namespace }}.svc.cluster.local/verify'
            signinUrl: 'https://signin.{{ .Release.Namespace }}.example.com/start'
    asserts:
      - documentIndex: 1
        equal:
          path: spec.forwardAuth.address
          value: "http://auth.NAMESPACE.svc.cluster.local/verify"
      - documentIndex: 1
        equal:
          path: spec.forwardAuth.authSigninURL
          value: "https://signin.NAMESPACE.example.com/start"

  - it: when forwardAuth passthrough set, should add a higher-priority route to the provider service and no middleware on it
    values:
      - values/service.yaml
    set:
      ingressRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /
          forwardAuth:
            enabled: true
            appName: oauth2proxy
            passthrough:
              path: /oauth2
    asserts:
      - matchSnapshot: {}

  - it: when forwardAuth has no appName, should build the middleware from the full inline spec
    values:
      - values/service.yaml
    set:
      ingressRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /
          # exercises the generic fields + every traefik-specific forwardAuth Middleware field
          forwardAuth:
            enabled: true
            # generic, controller-agnostic
            authUrl: http://custom.auth.svc.cluster.local/verify
            signinUrl: https://auth.example.com/sign_in
            authResponseHeaders:
              - X-Custom-User
              - X-Custom-Groups
            # traefik-specific raw forwardAuth Middleware fields
            controllers:
              traefik:
                middlewareParams:
                  trustForwardHeader: true
                  authResponseHeadersRegex: "^X-Custom-"
                  authRequestHeaders:
                    - Accept
                    - X-Forwarded-Method
                  addAuthCookiesToResponse:
                    - Session
                  forwardBody: true
                  maxBodySize: 1048576
                  maxResponseBodySize: 2097152
                  headerField: X-Auth-User
                  preserveLocationHeader: true
                  preserveRequestMethod: true
                  tls:
                    caSecret: auth-ca
                    certSecret: auth-cert
                    insecureSkipVerify: true
    asserts:
      - matchSnapshot: {}

  - it: when route sets forwardAuth fields, should override the app forwardAuth config
    values:
      - values/service.yaml
    set:
      ingressRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /
          forwardAuth:
            enabled: true
            appName: oauth2proxy
            authResponseHeaders:
              - Remote-User
            controllers:
              traefik:
                middlewareParams:
                  trustForwardHeader: false
    asserts:
      - documentIndex: 1
        equal:
          path: spec.forwardAuth.trustForwardHeader
          value: false
      - documentIndex: 1
        equal:
          path: spec.forwardAuth.authResponseHeaders
          value:
            - Remote-User

  - it: when app forwardAuth has controllers override, should merge the matching controller block and drop controllers key
    values:
      - values/service.yaml
    set:
      ingressRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /
          forwardAuth:
            enabled: true
            appName: oauth2proxy2
    asserts:
      - documentIndex: 1
        equal:
          path: spec.forwardAuth.trustForwardHeader
          value: true
      - documentIndex: 1
        notExists:
          path: spec.forwardAuth.controllers

  - it: when passthrough set without appName, should route the path to the inline service
    values:
      - values/service.yaml
    set:
      ingressRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /
          forwardAuth:
            enabled: true
            authUrl: http://custom.auth.svc.cluster.local/verify
            passthrough:
              path: /oauth2/
            service:
              name: oauth2proxy
              namespace: auth
              port: 4180
    asserts:
      - matchSnapshot: {}

  - it: when host is FQDN (no domain), should use host directly
    values:
      - values/service.yaml
    set:
      ingressRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          host: myapp.example.com
          path: /
    asserts:
      - matchSnapshot: {}

  - it: multi support
    values:
      - values/multi.yaml
      - values/service.yaml
    set:
      ingressRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: __DEPLOYMENT_ID__
          path: /
    asserts:
      - matchSnapshot: {}

  - it: when domain key is missing from cluster config, should fail
    values:
      - values/service.yaml
    set:
      ingressRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: nonexistent
          path: /
    asserts:
      - failedTemplate:
          errorMessage: "global.idpAppConfig.clusters.test.domains.nonexistent is not defined"

  - it: when gateway controller is not traefik, should fail
    values:
      - values/service.yaml
    set:
      global:
        idpAppConfig:
          clusters:
            test:
              httpGateways:
                traefik-public:
                  controller: istio
                  name: traefik-public
                  namespace: dev-gateway
      ingressRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /
    asserts:
      - failedTemplate:
          errorMessage: "ingressRoute: gateway 'traefik-public' has controller 'istio', only 'traefik' is supported"

  - it: when tlsOption is set, should generate TLSOption and reference it in IngressRoute
    values:
      - values/service.yaml
    set:
      ingressRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /
          tlsOption:
            minVersion: VersionTLS12
            maxVersion: VersionTLS13
            sniStrict: true
            cipherSuites:
              - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
            clientAuth:
              clientAuthType: VerifyClientCertIfGiven
              secretNames:
                - '{{ include "idp-app.fullname" . }}-config-mtls-ca'
    asserts:
      - matchSnapshot: {}

  - it: when tlsOption clientAuth uses only secretNames, should reference existing secrets
    values:
      - values/service.yaml
    set:
      ingressRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /
          tlsOption:
            minVersion: VersionTLS12
            clientAuth:
              clientAuthType: VerifyClientCertIfGiven
              secretNames:
                - existing-ca-secret
                - another-ca-secret
    asserts:
      - matchSnapshot: {}

  - it: should support external service backend
    set:
      ingressRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /
          service:
            name: my-external-svc
            port: 8080
    asserts:
      - matchSnapshot: {}

  - it: when service.enabled and ingressRoute.service.port is set, use port override
    values:
      - values/service.yaml
    set:
      ingressRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /
          service:
            port: 9090
    asserts:
      - matchSnapshot: {}

  - it: when stripPathPrefix is true, should create StripPrefix Middleware and reference it
    values:
      - values/service.yaml
    set:
      ingressRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /api
          stripPathPrefix: true
    asserts:
      - matchSnapshot: {}

  - it: when hosts list is set, should match all hosts in route rule
    values:
      - values/service.yaml
    set:
      ingressRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          hosts:
            - my-app.example.com
            - my-app.other.com
          path: /
    asserts:
      - equal:
          path: spec.routes[0].match
          value: "(Host(`my-app.example.com`) || Host(`my-app.other.com`)) && PathPrefix(`/`)"

  - it: when traefik.useIngressClassNameOnRoutes is true, should set spec.ingressClassName from gateway name
    values:
      - values/service.yaml
    set:
      ingressRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /
      global.idpAppConfig.clusters.test.httpGateways.traefik-public.traefik.useIngressClassNameOnRoutes: true
    asserts:
      - equal:
          path: spec.ingressClassName
          value: traefik-public

  - it: when stripPathPrefix is true and pathType is not PathPrefix, should fail
    values:
      - values/service.yaml
    set:
      ingressRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /api
          pathType: Exact
          stripPathPrefix: true
    asserts:
      - failedTemplate:
          errorMessage: "ingressRoute 'public': stripPathPrefix is only supported with pathType PathPrefix"
