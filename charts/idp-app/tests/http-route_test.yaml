suite: http-route
templates:
  - http-route.yaml
values:
  - values/minimum.yaml
tests:
  - it: should create HTTPRoute when gateway is enabled
    values:
      - values/service.yaml
    set:
      httpRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /
          pathType: PathPrefix
          annotations: { }
    asserts:
      - equal:
          path: metadata
          value:
            name: RELEASE-NAME-public
            labels:
              app.kubernetes.io/name: app-name
              app.kubernetes.io/instance: RELEASE-NAME
              app.kubernetes.io/version: 0.1.0
              app.kubernetes.io/managed-by: Helm
              traefik.io/controller: traefik-public
            annotations:
              traefik.io/controller: traefik-public
      - equal:
          path: spec
          value:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: traefik-public
                namespace: gateway-test
            hostnames:
              - "test.example.com"
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                backendRefs:
                  - group: ""
                    kind: Service
                    weight: 1
                    name: RELEASE-NAME
                    namespace: NAMESPACE
                    port: 80
  - it: when forwardAuth enabled, should add filter to httproute and generate traefik middleware
    values:
      - values/service.yaml
    set:
      httpRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /
          # https://oauth2-proxy.github.io/oauth2-proxy/features/endpoints#auth
          forwardAuth:
            enabled: true
            appName: oauth2proxy
    asserts:
      - matchSnapshot: { }

  - it: when forwardAuth authQueryParams set, should append query string to address
    values:
      - values/service.yaml
    set:
      httpRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /
          forwardAuth:
            enabled: true
            appName: oauth2proxy
            authQueryParams:
              allowed_groups: admins
    asserts:
      - documentIndex: 1
        equal:
          path: spec.forwardAuth.address
          value: "http://oauth2proxy.auth.svc.cluster.local/oauth2/auth?allowed_groups=admins"

  - it: when authUrl/signinUrl use templating, should render them with tpl
    values:
      - values/service.yaml
    set:
      httpRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /
          forwardAuth:
            enabled: true
            authUrl: 'http://auth.{{ .Release.Namespace }}.svc.cluster.local/verify'
            signinUrl: 'https://signin.{{ .Release.Namespace }}.example.com/start'
    asserts:
      - documentIndex: 1
        equal:
          path: spec.forwardAuth.address
          value: "http://auth.NAMESPACE.svc.cluster.local/verify"
      - documentIndex: 1
        equal:
          path: spec.forwardAuth.authSigninURL
          value: "https://signin.NAMESPACE.example.com/start"

  - it: when forwardAuth passthrough set, should add a rule routing the path to the provider service without the forwardAuth filter
    values:
      - values/service.yaml
    set:
      httpRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /
          forwardAuth:
            enabled: true
            appName: oauth2proxy
            passthrough:
              path: /oauth2/
    asserts:
      - matchSnapshot: { }

  - it: when forwardAuth has no appName, should build the middleware from the full inline spec
    values:
      - values/service.yaml
    set:
      httpRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /
          # exercises the generic fields + every traefik-specific forwardAuth Middleware field
          forwardAuth:
            enabled: true
            # generic, controller-agnostic
            authUrl: http://custom.auth.svc.cluster.local/verify
            signinUrl: https://auth.example.com/sign_in
            authResponseHeaders:
              - X-Custom-User
              - X-Custom-Groups
            # traefik-specific raw forwardAuth Middleware fields
            controllers:
              traefik:
                middlewareParams:
                  trustForwardHeader: true
                  authResponseHeadersRegex: "^X-Custom-"
                  authRequestHeaders:
                    - Accept
                    - X-Forwarded-Method
                  addAuthCookiesToResponse:
                    - Session
                  forwardBody: true
                  maxBodySize: 1048576
                  maxResponseBodySize: 2097152
                  headerField: X-Auth-User
                  preserveLocationHeader: true
                  preserveRequestMethod: true
                  tls:
                    caSecret: auth-ca
                    certSecret: auth-cert
                    insecureSkipVerify: true
    asserts:
      - matchSnapshot: { }

  - it: when route sets forwardAuth fields, should override the app forwardAuth config
    values:
      - values/service.yaml
    set:
      httpRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /
          forwardAuth:
            enabled: true
            appName: oauth2proxy
            authResponseHeaders:
              - Remote-User
            controllers:
              traefik:
                middlewareParams:
                  trustForwardHeader: false
    asserts:
      - documentIndex: 1
        equal:
          path: spec.forwardAuth.trustForwardHeader
          value: false
      - documentIndex: 1
        equal:
          path: spec.forwardAuth.authResponseHeaders
          value:
            - Remote-User

  - it: when app forwardAuth has controllers override, should merge the matching controller block and drop controllers key
    values:
      - values/service.yaml
    set:
      httpRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /
          forwardAuth:
            enabled: true
            appName: oauth2proxy2
    asserts:
      - documentIndex: 1
        equal:
          path: spec.forwardAuth.trustForwardHeader
          value: true
      - documentIndex: 1
        notExists:
          path: spec.forwardAuth.controllers

  - it: when passthrough set without appName, should route the path to the inline service
    values:
      - values/service.yaml
    set:
      httpRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /
          forwardAuth:
            enabled: true
            authUrl: http://custom.auth.svc.cluster.local/verify
            passthrough:
              path: /oauth2/
            service:
              name: oauth2proxy
              namespace: auth
              port: 4180
    asserts:
      - matchSnapshot: { }

  - it: when forwardAuth enabled with unsupported gateway controller, should fail
    values:
      - values/service.yaml
    set:
      global:
        idpAppConfig:
          clusters:
            test:
              httpGateways:
                traefik-public:
                  controller: istio
                  name: traefik-public
                  namespace: gateway-test
      httpRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /
          forwardAuth:
            enabled: true
            appName: oauth2proxy
    asserts:
      - failedTemplate:
          errorMessage: "forwardAuth filter is only supported with traefik gateway controller"

  - it: when host is FQDN (no domain), should use host directly
    values:
      - values/service.yaml
    set:
      httpRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          host: myapp.example.com
          path: /
    asserts:
      - equal:
          path: spec.hostnames[0]
          value: myapp.example.com

  - it: when domain key is missing from cluster config, should fail
    values:
      - values/service.yaml
    set:
      httpRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: nonexistent
          path: /
    asserts:
      - failedTemplate:
          errorMessage: "global.idpAppConfig.clusters.test.domains.nonexistent is not defined"
  - it: when domain has <HOST.> placeholder and host is set, should embed host with dot separator
    values:
      - values/service.yaml
    set:
      httpRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: host-dot-dev
          host: aaa
          path: /
    asserts:
      - equal:
          path: spec.hostnames[0]
          value: aaa.dev.example.com

  - it: when domain has <HOST-> placeholder and host is set, should embed host with dash separator
    values:
      - values/service.yaml
    set:
      httpRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: host-dash-dev
          host: aaa
          path: /
    asserts:
      - equal:
          path: spec.hostnames[0]
          value: aaa-dev.example.com

  - it: when domain has <HOST_> placeholder and host is set, should embed host with underscore separator
    values:
      - values/service.yaml
    set:
      httpRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: host-under-dev
          host: aaa
          path: /
    asserts:
      - equal:
          path: spec.hostnames[0]
          value: aaa_dev.example.com

  - it: when domain has <HOST.> placeholder and no host is set, should remove placeholder
    values:
      - values/service.yaml
    set:
      httpRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: host-dot-dev
          path: /
    asserts:
      - equal:
          path: spec.hostnames[0]
          value: dev.example.com

  - it: when domain has <HOST-> placeholder and no host is set, should remove placeholder
    values:
      - values/service.yaml
    set:
      httpRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: host-dash-dev
          path: /
    asserts:
      - equal:
          path: spec.hostnames[0]
          value: dev.example.com

  - it: multi support
    values:
      - values/multi.yaml
      - values/service.yaml
    set:
      httpRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: __DEPLOYMENT_ID__
          path: /
    asserts:
      - equal:
          path: metadata
          value:
            name: RELEASE-NAME-one-public
            labels:
              app.kubernetes.io/name: app-name
              app.kubernetes.io/instance: RELEASE-NAME-one
              app.kubernetes.io/version: 0.1.0
              app.kubernetes.io/managed-by: Helm
              traefik.io/controller: traefik-public
            annotations:
              traefik.io/controller: traefik-public
        documentIndex: 0
      - equal:
          path: spec
          value:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: traefik-public
                namespace: gateway-test
            hostnames:
              - "one.example.com"
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                backendRefs:
                  - group: ""
                    kind: Service
                    weight: 1
                    name: RELEASE-NAME-one
                    namespace: NAMESPACE
                    port: 80
        documentIndex: 0
      - equal:
          path: metadata
          value:
            name: RELEASE-NAME-two-public
            labels:
              app.kubernetes.io/name: app-name
              app.kubernetes.io/instance: RELEASE-NAME-two
              app.kubernetes.io/version: 0.1.0
              app.kubernetes.io/managed-by: Helm
              traefik.io/controller: traefik-public
            annotations:
              traefik.io/controller: traefik-public
        documentIndex: 1
      - equal:
          path: spec
          value:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: traefik-public
                namespace: gateway-test
            hostnames:
              - "two.example.com"
            rules:
              - matches:
                  - path:
                      type: PathPrefix
                      value: /
                backendRefs:
                  - group: ""
                    kind: Service
                    weight: 1
                    name: RELEASE-NAME-two
                    namespace: NAMESPACE
                    port: 80
        documentIndex: 1

  - it: when stripPathPrefix is true, should add URLRewrite filter
    values:
      - values/service.yaml
    set:
      httpRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /api
          stripPathPrefix: true
    asserts:
      - matchSnapshot: {}

  - it: when hosts list is set, should use all hosts in hostnames
    values:
      - values/service.yaml
    set:
      httpRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          hosts:
            - my-app.example.com
            - my-app.other.com
          path: /
    asserts:
      - equal:
          path: spec.hostnames
          value:
            - my-app.example.com
            - my-app.other.com

  - it: when stripPathPrefix is true and pathType is not PathPrefix, should fail
    values:
      - values/service.yaml
    set:
      httpRoutes:
        public:
          enabled: true
          gatewayName: traefik-public
          domain: example.com
          host: test
          path: /api
          pathType: Exact
          stripPathPrefix: true
    asserts:
      - failedTemplate:
          errorMessage: "httpRoute 'public': stripPathPrefix is only supported with pathType PathPrefix"
